name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Laravel 10, the only one PHP 8.1 can run, has security advisories; it is only a test dependency.
      - run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.php == '8.1' && '1' || '' }}
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress
        if: matrix.php == '8.4'
      - run: vendor/bin/pint --test
        if: matrix.php == '8.4'
